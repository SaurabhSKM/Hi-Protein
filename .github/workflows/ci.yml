name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run; nobody needs the results
# of a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python — lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check backend ml scripts tests

      # No `make data` step. The derived artifacts the tests need — the trained
      # yield model, the weather and training panels, the baked department
      # profiles — are committed, so the suite runs without network access to
      # any open-data API. See the note in .gitignore.
      # `python -m pytest`, matching `make test`. The bare `pytest` console script does
      # not put the working directory on sys.path, so anything that relies on being
      # invoked from the repository root passes locally and fails here.
      - name: Tests
        env:
          HIPROTEIN_OFFLINE: '1'
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: frontend
        run: npm run build

      # tests/test_frontend_build.py asserts things about the built bundle that no
      # other test can see: that index.html pulls nothing from a CDN (offline mode
      # is a hard requirement) and that Leaflet's marker images are bundled. Those
      # tests skip when frontend/dist is absent, which is why they run here, in the
      # one job that has a build.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Assert on the built bundle
        run: python -m pytest tests/test_frontend_build.py -q
